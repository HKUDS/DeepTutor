system: |
  You are the DeepTutor BookEngine Desmos graph generator. Return only a JSON
  object that strictly matches this shape:
  {"title":"...","description":"...","expressions":["y=x^2","y=2x+1"]}
  expressions are Desmos-recognised function expressions (infix, e.g. y=x^2,
  y=sin(x)), 1~6 of them, ordered by pedagogical importance. Output no extra
  fields or comments.

user_template: |
  Chapter: {chapter_title}
  Summary: {chapter_summary}
  Objectives: {objectives_inline}
  Focus point: {focus}

  Provide function expressions worth observing in Desmos for this point. Output JSON directly.

short_description: "抓取具体网页或支持的视频字幕，并提取为 markdown 文本。"
when_to_use: "用户消息里出现具体 URL 且需要读页面或视频时使用：博客 / 教材 / 论文链接、YouTube 或 B 站学习视频，或明确说\"帮我读这个页面\"。普通主题搜索请用 web_search。"
input_format: "{\"url\": \"完整 http(s):// URL\", \"max_chars\": 50000, \"generate_transcript_if_missing\": false}。max_chars 可选，默认 50000；generate_transcript_if_missing 只在用户明确要求预处理无字幕视频时设为 true。"
guideline: "对于需要登录、有反爬虫、或纯前端 JS 渲染的页面会失败——失败时如实告知用户，不要凭空补内容。返回结果是已经去掉脚本/侧边栏的纯文本（首行 `# 标题`）。"
note: "YouTube 学习优先使用管理员配置的 Invidious；可选适配器和音频预处理只作为后备。B 站学习优先使用无需登录即可访问的字幕。无字幕时仅在用户明确要求后提交后台预处理；预处理只临时读取音频轨并转写，不保存视频。无字幕、任务排队或运行中都要如实说明，不要凭标题和简介推测内容。拒绝 file:// / localhost / 内网 IP 等地址。一次只抓一个 URL；要抓多个分多次调用。"
phase: "exploration"

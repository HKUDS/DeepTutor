short_description: "列出用户挂载的某个知识库中的文档清单与总数。"
when_to_use: "当问题问的是知识库本身而不是其内容时使用——有多少个文件、文件都叫什么、某个文档在不在里面、上传了些什么。"
input_format: "{\"kb_name\": \"挂载的某个知识库名称\", \"pattern\": \"可选，'*.pdf' 这样的通配符或一段文件名\", \"limit\": \"可选，最多列出多少个\"}。"
guideline: "绝不能用 rag 检索到的片段回答数量或某文件是否存在的问题——检索只反映某次搜索命中的内容，说明不了整个知识库有多大。系统提示里的知识库清单已经给出了数量；需要完整清单或按名称筛选时才调用本工具。"
note: "数量来自知识库中实际存放的文件。索引未就绪的知识库依然能列出文档；由远端服务器托管的知识库则无法列出——两种情况都据实说明。"
phase: "exploration"

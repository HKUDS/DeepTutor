short_description: "给学习者一张卡片，回到某个已有的学习会话，并预先写好开场消息。"
when_to_use: "学习者想继续之前在某个主题上做的事情时使用。需要 mastery_sessions 给出的 session_id。"
input_format: "{\"path_id\": \"...\", \"session_id\": \"...\", \"opening_message\": \"以学习者口吻写的第一句话\", \"module\": \"可选：课节 id / 名称 / 序号\", \"reason\": \"一句话说明为什么现在做这件事\"}"
guideline: "开场消息要用学习者自己的语言、按他会怎么打字来写；他点名了哪一课就把课名写进去——对面的导师会先读这句话再决定教什么。然后用一句话说明他到那边会看到什么。不要描述按钮，不要说你正在为他打开，也不要在当前对话里开始教这个主题。"
note: "只产出一张由学习者点击的卡片；不会自行跳转，也不改动任何进度。id 会先经过校验，所以卡片不会指向不存在的课节或会话。"
phase: "synthesis"

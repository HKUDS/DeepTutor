short_description: "给学习者一张卡片，在某个主题下新开一次学习会话，并预先写好开场消息。"
when_to_use: "学习者想在某个主题上做点什么、但已有的会话都不合适时使用——换个角度、复习某一课，或者这个主题还没有任何会话。"
input_format: "{\"path_id\": \"...\", \"opening_message\": \"以学习者口吻写的第一句话\", \"module\": \"可选：课节 id / 名称 / 序号\", \"reason\": \"一句话说明为什么现在做这件事\"}"
guideline: "规则与 mastery_open_session 相同：开场消息用学习者的口吻写，他点名了哪一课就写进去。主题的全部进度分毫不失——新的只是这次会话，所以要这样说，而不是提醒他「要从头开始」。"
note: "只产出一张由学习者点击的卡片；不会自行跳转，也不改动任何进度。"
phase: "synthesis"

short_description: "在隔离沙箱中运行一段代码（python/c/cpp），返回 stdout/stderr 和生成文件。"
when_to_use: "用于计算、校验、数据处理，或用 Python 生成文件，而不是把源码嵌进 shell 命令。"
input_format: "`language`（python、c 或 cpp）+ `code`——完整、可直接运行的源码。可选 `stdin` 与 `timeout`（秒，默认 30）。"
guideline: "自行写出完整源码，把输出文件保存到当前工作目录，并打印简短完成信息。绝不要通过 exec 的 `python -c` 或 heredoc 运行这段源码；exec 只用于真正必须使用 shell 的命令。完整保留明确的数量和范围；失败或产物缺失时先诊断 stderr 或根因，更换策略，绝不原样重复提交代码。"
note: "在本回合 workspace 内运行，与 `exec` 共用同一套 OS 级隔离沙箱；未配置沙箱后端时不可用。把生成文件保存到工作目录即可作为产物输出。"
phase: "verification"
aliases:
  - name: run_code
    description: "运行一段代码（python/c/cpp），用于计算、验证、可视化或生成文件。"
    input_format: "`language` + `code`；可选 `stdin`、`timeout`。"
    when_to_use: "适合做客观校验、快速计算、小规模实验或用 Python 生成文件。"
    phase: "verification"

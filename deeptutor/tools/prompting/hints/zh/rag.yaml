short_description: "在用户挂载的某个知识库中检索相关内容。"
when_to_use: "当答案大概率来自用户挂载的知识库（定义、公式、概念解释、教材内容）时使用。"
input_format: "{\"query\": \"非空自然语言查询\", \"kb_name\": \"挂载的某个知识库名称\"}。"
guideline: "课程材料优先检索知识库；概念检索必要时也用来源语言查询。精确图号用 figure 和 kb_files 中的 source_path；矢量图、稀疏图注、表格或模糊标签用 source_path/page，必要时用归一化区域 region=[x0,y0,x1,y1]。追问沿用引用的 asset_id 或 source_hash，并重新读取实际像素后再作详细视觉判断。比较两份材料时分别调用，保持图片预算有界。"
note: "query 不能为空。保持图表编号和来源边界准确；歧义、缺失像素、不支持的页面或冲突证据应要求选择来源、检查页面或明确保留判断，不能替换成相似图。区分可见观察、仅基于图注的解释和一般背景知识；来源特定结论必须展示可核对的原图与位置。"
phase: "exploration"

short_description: "列出学习者的精通之路主题——进度、到期复习、会话数，以及每个主题的课节（模块）大纲。"
when_to_use: "只要学习者提到自己正在学的东西（而不是单纯问一个知识问题）就调用：「带我复习统计课第一课」「我手上还有什么没学完」「考考我机器学习那条路」。在其它 mastery_* 导航工具之前必须先调用它，把学习者的说法解析成真实的 id。"
input_format: "{} 列出全部；{\"query\": \"统计\"} 按主题名、目标或课节名筛选。"
guideline: "学习者的原话通常是对某个主题、往往还包括其中某一课的模糊指代——这个工具就是用来把两者都对准的。不要在当前对话里直接开始教：这里没有知识地图、没有大纲、也没有掌握门槛。对准之后用 mastery_open_session / mastery_new_session 交接过去。"
note: "只读；学习者至少有一个主题时才会出现。不会与 `mastery_paths` 同时出现（导师回合用后者读同一份地图）。"
phase: "exploration"

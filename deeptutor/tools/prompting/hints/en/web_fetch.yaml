short_description: "Fetch a specific page or supported video transcript as markdown."
when_to_use: "When the user's message contains a specific URL and reading that page or video is needed: shared blog / textbook / paper links, a YouTube or Bilibili learning video, or an explicit 'read this page' request. Use ``web_search`` for general topic searches."
input_format: "{\"url\": \"full http(s):// URL\", \"max_chars\": 50000, \"generate_transcript_if_missing\": false}. ``max_chars`` and ``generate_transcript_if_missing`` are optional; set the latter true only when the user explicitly asks to preprocess a video that has no subtitle."
guideline: "Login-walled, anti-bot, or JS-only pages may return little useful content — say so honestly, don't fabricate around an empty result. The returned text already has scripts and sidebars stripped (first line is `# Title` when available)."
note: "YouTube learning uses the administrator-configured Invidious instance first; optional adapters and audio-only ASR are fallback paths. Bilibili learning prefers a subtitle exposed without credentials. For no-subtitle videos, submit background preprocessing only on request; it transcribes a transient audio-only stream and never saves video. Report no-subtitle or running-job results honestly instead of guessing from metadata. Refuses file:// / localhost / private IP addresses. Fetches one URL per call; issue separate calls for multiple URLs."
phase: "exploration"

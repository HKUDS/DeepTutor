short_description: "Run SQL against a persistent per-session SQLite database; SELECT results come back as Markdown tables with optional Chart.js visualization."
when_to_use: "When the task involves structured data, relational queries, schema design, data manipulation, or tabular analysis — creating tables, inserting rows, filtering, aggregating, or joining. Use `chart` to visualize query results as bar, line, pie, doughnut, radar, or scatter charts."
input_format: "`query` — any valid SQLite statement. Optional `chart` (bar/line/pie/doughnut/radar/scatter) and `chart_title` for visualization."
guideline: "Use CREATE TABLE to set up a schema first, then INSERT data, then SELECT to query. The database persists across turns in this chat session. For large inserts, batch multiple rows in a single statement. Quote string values with single quotes. When the user asks to visualize or chart data, use the `chart` parameter — the first column becomes labels, remaining numeric columns become datasets."
note: "The SQLite database file is stored in the session workspace and survives across turns. No sandbox required. Chart visualizations are rendered as interactive Chart.js HTML files."
phase: "expansion"

guideline: "Call once near the start of a continuing teaching turn. If empty, offer to set a mission via learning_update rather than inventing progress. Do not confuse this with Memory preferences."
note: "Complements Mastery Path and Memory. Soft state only — no scored gates."
phase: "exploration"

short_description: "Read the soft learning journal (mission, last session, recent insights)."
when_to_use: "The user wants to continue a multi-session learning topic, asks where they left off, or you are about to teach across sessions and need the mission / next focus. Prefer mastery_status for Guided Learning curriculum progress."

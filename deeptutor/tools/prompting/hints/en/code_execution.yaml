short_description: "Run a code snippet (python/c/cpp) in an isolated sandbox; returns stdout/stderr and generated files."
when_to_use: "Use for computation, verification, data processing, or creating a file with Python instead of embedding source in a shell command."
input_format: "`language` (python, c, or cpp) + `code` — the complete, ready-to-run source. Optional `stdin` and `timeout` (seconds, default 30)."
guideline: "Write complete source yourself, save output files to the working directory, and print a concise completion message. Never run this source through exec with `python -c` or a heredoc; use exec only for a command that is genuinely shell-only. Preserve explicit quantities and scope; diagnose stderr or the root cause after failure or a missing artifact, change strategy, and never resubmit identical code."
note: "Runs in this turn's workspace under the same OS-isolated sandbox as `exec`; unavailable when no sandbox backend is configured. Save generated files to the working directory to surface them as artifacts."
phase: "verification"
aliases:
  - name: run_code
    description: "Run a code snippet (python/c/cpp) for calculation, verification, visualization, or file generation."
    input_format: "`language` + `code`; optional `stdin`, `timeout`."
    when_to_use: "Use for objective checks, quick calculations, small experiments, or Python-generated files."
    phase: "verification"

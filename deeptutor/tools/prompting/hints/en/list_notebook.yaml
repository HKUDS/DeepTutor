short_description: "Discover the user's favorites collections (no args → index) or the records inside one favorites collection (notebook_id → drill-down)."
when_to_use: "Call BEFORE `save_favorite` in edit mode so you have valid record ids. Also useful when the user references a favorites collection by description but you need its exact id, or when planning a multi-step save."
input_format: "{} for the index, or {\"notebook_id\": \"id from the system-prompt favorites collection list / from a prior index call\"} to list records in one favorites collection."
guideline: "Index mode shows id + name + record_count; drill-down shows record id + title + summary + date (newest first, capped at ~80). Don't call list_favorites just to confirm favorites collection names already visible in the system-prompt manifest — only call it when you genuinely need fresh info (e.g. to discover record ids for an edit, or after the user adds favorites collections)."
note: "Auto-mounted only when the user has at least one favorites collection. Output is markdown so you can paste/quote chunks back to the user."
phase: "exploration"

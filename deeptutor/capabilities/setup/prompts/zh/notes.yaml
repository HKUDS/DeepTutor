# 随轮次出现的配置提示（协议本身在 system.md）。可延迟工具时由
# SetupCapability.turn_note 放到 user 消息末尾；不能延迟时由旧的 system 块使用。
# 占位符：{tools} —— 配置工具名，反引号包裹、逗号分隔。
# 可在 prompt pack 的 setup.notes.<key> 下覆盖。

# 每轮提示的第一行。
header: "[配置助手]"

# 缺口列表的标题；缺口本身来自安装检查。
gaps_heading: "## 这个实例目前缺少的配置"
gaps_none: "- 无。"

# 有阻塞缺口的实例上的第一次对话。用户没有提这件事，所以开口要有分寸：
# 只点出最缺的那一项、提出可以帮忙配置，用户想做别的就不再提。
intro: |-
  ## 这是用户的第一次对话
  用户没有问配置的事。先回答用户实际说的内容。然后在结尾用一两句话提一下上面最重要的那一项缺口，并提出可以帮忙配置。不要列出所有缺口，不要一开头就讲，用户转去做别的事后也不要再提。

# 每轮提示里接在 intro 之后。
intro_load: >-
  如果用户接受，先用 `load_tools` 加载配置工具（{tools}），它的返回里附有使用规范。

# 用户打开了配置模式，工具已记为已加载。
explicit: >-
  用户打开了配置模式，配置工具已加载，按此前给出的配置工具使用规范操作。

# 消息看起来是在要求改配置（消息启发式）。
intent: >-
  这条消息像是要修改 DeepTutor 自身的配置。配置工具（{tools}）在扩展工具里：先用
  `load_tools` 加载需要的那几个，它的返回里附有这些工具的使用规范，照规范操作。如果这条消息其实和
  DeepTutor 的配置无关，忽略这段提示。

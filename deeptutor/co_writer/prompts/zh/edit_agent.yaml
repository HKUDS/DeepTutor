system: |
  你是一位专业的编辑和写作助手。

  可用参考工具：
  {available_tools}

  只有在提供了参考上下文时才使用它；如果没有提供参考上下文，就只依据用户指令和目标文本完成编辑。

action_template: |
  根据用户的指令{action_verb}以下文本。

  用户指令：{instruction}

context_template: |
  参考上下文（{source_label}）：
  {context}

user_template: |
  要编辑的目标文本：
  {text}

  只输出编辑后的文本，不要包含引号或解释。

auto_mark_system: |
  你是阅读批注助手。结果会直接写入可编辑的 Markdown 草稿，因此标注必须在纯文本中可读。

  保留原文的措辞、标点、段落和 Markdown，只插入以下可见的行内标记：
  - 【术语】标记简短的核心概念、名称或数值。
  - 《关键句》标记简短的定义、发现或结论。

  保持克制：每 100 字最多标记一个术语，每段最多标记两处关键句。标记不得嵌套，也不要包住 `**`、反引号等 Markdown 符号。绝不输出 HTML、XML、CSS 或 data 属性。如果没有值得标注的内容，原样返回。只输出标注后的草稿。

  输入示例：
  深度学习是机器学习的一个子领域，其核心是使用神经网络来学习数据表示。
  输出示例：
  《深度学习是机器学习的一个子领域》，其核心是使用【神经网络】来学习数据表示。

auto_mark_user_template: |
  处理以下文本：
  {text}

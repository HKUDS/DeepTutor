  <head><title>Book 2 - Little Bug</title></head>
  <body>
    <div class="page"><p>A little bug sat on a rock. The green grass is warm and soft today.</p></div>
    <div class="page"><p>The bug ran up a twig in the sun. It looked at the big brown tree.</p></div>
    <div class="page"><p>Peg and Ted went to see the little bug. They walked quietly on the path.</p></div>
    <div class="page"><p>Run fast, little bug! Hide under the big round rock until tomorrow.</p></div>
  </body>

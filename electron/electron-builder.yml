appId: com.deeptutor.desktop
productName: DeepTutor
directories:
  buildResources: build
  output: dist
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.*"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
  - "**/*.py"
win:
  icon: build/icon.png
  executableName: DeepTutor
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: "${name}-${version}-setup.${ext}"
  shortcutName: "${productName}"
  uninstallDisplayName: "${productName}"
  createDesktopShortcut: always
mac:
  icon: build/icon.png
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: DeepTutor needs camera access for video calls
    - NSMicrophoneUsageDescription: DeepTutor needs microphone access for voice input
  notarize: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
dmg:
  artifactName: "${name}-${version}.${ext}"
linux:
  icon: build/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: HKUDS
  category: Education
appImage:
  artifactName: "${name}-${version}.${ext}"
npmRebuild: true
publish:
  provider: github
  owner: HKUDS
  repo: DeepTutor

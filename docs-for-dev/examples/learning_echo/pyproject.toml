[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deeptutor-learning-echo"
version = "1.0.0"
description = "Minimal DeepTutor Tool and Capability plugin example"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["learning_echo"]

[tool.setuptools.package-data]
learning_echo = ["deeptutor.plugin.json", "frontend/*"]

name: Repository Hygiene

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  hygiene:
    name: Check tracked generated files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run repository hygiene check
        run: python3 scripts/check_workspace_hygiene.py

      # `.gitattributes` declares `* text=auto eol=lf`, but a declaration only
      # holds while something enforces it. This reads the index, so it catches a
      # CRLF blob at the moment it is committed rather than after it has spread
      # into every Windows clone.
      - name: Check committed line endings
        run: python3 scripts/check_line_endings.py

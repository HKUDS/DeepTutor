name: Repository Hygiene

on:
  push:
    branches:
      - main
      - dev
      - preview
  pull_request:
    branches:
      - main
      - dev
      - preview

# A new push supersedes every earlier run for the same PR/branch. Without this,
# each fix-up commit leaves the previous full matrix running to completion,
# delaying feedback for the author and every other PR in the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Check tracked generated files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run repository hygiene check
        run: python3 scripts/check_workspace_hygiene.py

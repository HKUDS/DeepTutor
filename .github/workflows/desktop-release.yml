name: Desktop Release

# Builds the desktop artifacts on a release tag (or on demand):
#   * one runtime pack per platform, with a per-platform catalog fragment
#   * a merged runtime-packs.json the shell reads to update its runtime
#   * the shell bundles (dmg / nsis / msi) plus the signed updater artifacts
#   * one latest.json the shell reads to update itself
#
# Packs must be built on their own platform: a relocatable venv still contains
# that platform's interpreter and wheels. Shell bundles are built per platform
# for the same reason (a dmg/nsis is a native artifact), which is also where
# code signing and notarization happen.
#
# Signing is driven entirely by repository secrets; see
# `desktop/RELEASE_SIGNING.md` for what each one is and what degrades when it is
# absent. In short: no Apple certificate → unsigned (ad-hoc) macOS bundles and no
# notarization; no updater key → no signatures and no latest.json, so the app
# keeps working but never sees an update.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload artifacts to the GitHub release for this tag"
        type: boolean
        default: false
      include_linux:
        description: "Also build the Linux runtime pack (preview: no Linux shell yet)"
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAURI_CLI_VERSION: "^2"

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shell version must match deeptutor/__version__.py
        run: python3 desktop/scripts/sync_version.py --check

      # Everything downstream labels itself from `__version__.py` while the
      # release asset URLs come from the tag. A tag that disagrees produces a
      # `latest.json` whose version equals the installed one, i.e. a release
      # nobody is ever offered.
      - name: The release tag must match deeptutor/__version__.py
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = (os.environ.get("RELEASE_TAG") or "").strip()
          if not tag:
              # `workflow_dispatch` can run from a branch; there is no tag to
              # compare, but publishing from one would mislabel the release.
              if os.environ.get("REF_TYPE") != "tag":
                  print("::warning title=No release tag::This run is not on a tag, so the tag/version check is skipped.")
                  raise SystemExit(0)
              tag = (os.environ.get("REF_NAME") or "").strip()

          match = re.match(r"^v?(\d+\.\d+\.\d+)", tag)
          if not match:
              raise SystemExit(f"release tag {tag!r} does not look like a version tag")
          tag_version = match.group(1)

          source = Path("deeptutor/__version__.py").read_text(encoding="utf-8")
          found = re.search(r'^__version__\s*=\s*"([^"]+)"', source, re.MULTILINE)
          if not found:
              raise SystemExit("could not find __version__ in deeptutor/__version__.py")
          code_version = found.group(1).strip()
          if code_version != tag_version:
              raise SystemExit(
                  f"release tag {tag!r} (normalised {tag_version!r}) does not match "
                  f"deeptutor/__version__.py value {code_version!r}; "
                  "bump __version__ before tagging"
              )
          print(f"release tag {tag} matches {code_version}")
          PY

      - name: The dependency lock must match pyproject.toml
        run: |
          set -euo pipefail
          # Pinned, for two reasons. uv writes its own command line — including
          # `-o` — into the lock's header, so an unpinned uv is a diff waiting to
          # happen; and every uv before 0.11.15 carries a published advisory
          # about wheel entry points escaping the environment. 0.11.15 was
          # checked to reproduce the committed lock byte for byte.
          pip install --quiet "uv==0.11.15"
          # Compile to the *committed path*, not a scratch file. Two reasons:
          # the header then names the same path the committed file does, and uv
          # only prefers the existing pins when the output file already exists —
          # writing somewhere else silently re-resolves the whole lock.
          cp desktop/pack/runtime.lock.txt /tmp/committed.lock
          uv pip compile pyproject.toml --extra cli --extra server \
            --python-version 3.12 --quiet -o desktop/pack/runtime.lock.txt
          if ! diff -u /tmp/committed.lock desktop/pack/runtime.lock.txt; then
            echo "::error::desktop/pack/runtime.lock.txt is stale; regenerate it with the command in its own header."
            exit 1
          fi

      # A release with an empty pubkey builds bundles nobody can ever update
      # from. Catch it here rather than in a bug report three months later.
      - name: The update channel must be configured
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys

          config = json.loads(pathlib.Path("desktop/src-tauri/tauri.conf.json").read_text())
          updater = (config.get("plugins") or {}).get("updater") or {}
          endpoints = updater.get("endpoints") or []
          pubkey = (updater.get("pubkey") or "").strip()
          create = (config.get("bundle") or {}).get("createUpdaterArtifacts")
          problems = []
          if not pubkey:
              problems.append("plugins.updater.pubkey is empty")
          if not endpoints:
              problems.append("plugins.updater.endpoints is empty")
          if not create:
              problems.append("bundle.createUpdaterArtifacts is not enabled")
          if not updater.get("requireSignedVersion"):
              # Without it a crafted endpoint response can pair a new version
              # number with an older, genuinely signed artifact.
              problems.append("plugins.updater.requireSignedVersion is not enabled")
          if problems:
              print("desktop update channel is not configured:", file=sys.stderr)
              for problem in problems:
                  print(f"  - {problem}", file=sys.stderr)
              sys.exit(1)
          print(f"update channel ok: {endpoints[0]}")
          PY

  packs:
    name: Runtime pack (${{ matrix.platform }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            os: macos-14
          - platform: macos-x86_64
            os: macos-13
          - platform: windows-x86_64
            os: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        run: pip install --quiet uv

      - name: Build the web frontend once per platform
        working-directory: web
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Build the runtime pack
        run: python3 desktop/pack/build_pack.py --skip-web-build --platform ${{ matrix.platform }}

      - name: Upload the pack and its catalog fragment
        uses: actions/upload-artifact@v4
        with:
          name: runtime-pack-${{ matrix.platform }}
          path: |
            desktop/pack/dist/*.tar.gz
            desktop/pack/dist/*.tar.gz.sha256
            desktop/pack/dist/*.catalog.json
          if-no-files-found: error
          retention-days: 14

  catalog:
    name: Assemble runtime-packs.json
    needs: [packs, packs-linux, deltas]
    # `packs-linux` is usually skipped, and a skipped dependency would otherwise
    # skip the catalog too. `deltas` is best-effort: a release without an
    # incremental path is still a complete release.
    if: always() && needs.packs.result == 'success'
    runs-on: ubuntu-latest
    env:
      # Job-level so the signing step's `if:` can test it (`secrets` is not
      # available in `if:`), the same trick the shell job uses.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download every pack fragment
        uses: actions/download-artifact@v4
        with:
          path: desktop/pack/dist
          pattern: runtime-pack-*
          merge-multiple: true

      - name: Download the incremental fragments
        # `if-no-files-found: warn` with no matching artifact is an error for
        # download-artifact, so this step tolerates the first release (no delta).
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: desktop/pack/dist
          pattern: pack-delta-*
          merge-multiple: true

      - name: Merge the fragments
        run: |
          python3 desktop/pack/assemble_catalog.py \
            --dist desktop/pack/dist \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"

      # The catalog is the document that names both the archive and the sha256
      # that authenticates it. The shell verifies it with the same minisign key
      # as the shell plane (`plugins.updater.pubkey`), and *requires* a valid
      # signature whenever that key is configured — so an unsigned catalog is a
      # runtime-update plane nobody can use.
      - name: Sign the catalog
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}
          # `signer sign` writes `<file>.sig` next to the catalog, which is the
          # first name the shell looks for. `-f` is *not* the file to sign — it
          # is `--private-key-path` — so the file is positional.
          tauri signer sign desktop/pack/dist/runtime-packs.json \
            -k "$TAURI_SIGNING_PRIVATE_KEY" \
            -p "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          ls -l desktop/pack/dist/runtime-packs.json.sig

      - name: Warn when the catalog cannot be signed
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: |
          echo "::warning title=Runtime update plane unsigned::TAURI_SIGNING_PRIVATE_KEY is not set, so runtime-packs.json ships unsigned. A shell with an update pubkey configured will refuse it (fail closed) and only the shell plane will update."

      - name: Publish the catalog
        uses: actions/upload-artifact@v4
        with:
          name: runtime-packs
          path: |
            desktop/pack/dist/runtime-packs.json
            desktop/pack/dist/runtime-packs.json.sig
          if-no-files-found: error

  # Incremental runtime updates: diff this release's pack against the previous
  # release's pack for the same platform. Best-effort by design — no earlier
  # release, or a delta that would be nearly as big as the full pack, simply
  # means this release ships the full archive alone.
  deltas:
    name: Incremental pack (${{ matrix.platform }})
    needs: packs
    # A missing delta is a smaller download missed, not a broken release, so this
    # job must not paint the whole run red.
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            os: macos-14
          - platform: macos-x86_64
            os: macos-13
          - platform: windows-x86_64
            os: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download this release's pack
        uses: actions/download-artifact@v4
        with:
          name: runtime-pack-${{ matrix.platform }}
          path: current

      - name: Fetch the newest earlier pack for this platform
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_tag="${{ github.event.release.tag_name || github.ref_name }}"
          mkdir -p previous
          # Walk back through releases: one may predate the desktop pipeline, or
          # have failed before it uploaded a pack.
          gh release list --exclude-drafts --limit 5 --json tagName --jq '.[].tagName' > tags.txt
          tag=""
          while read -r candidate; do
            [ -z "$candidate" ] && continue
            [ "$candidate" = "$current_tag" ] && continue
            if gh release download "$candidate" \
                 --pattern "*-${{ matrix.platform }}.tar.gz" \
                 --dir "previous/$candidate" 2>/dev/null; then
              tag="$candidate"
              break
            fi
          done < tags.txt
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "::notice title=No incremental update::No earlier release carries a ${{ matrix.platform }} pack, so this release ships the full archive only."
          else
            echo "building the incremental path from $tag"
          fi

      - name: Build the incremental update
        if: steps.previous.outputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p base target out
          tar -xzf previous/*/*.tar.gz -C base
          tar -xzf current/*.tar.gz -C target
          # `--max-ratio` refuses a "delta" that would cost nearly a full
          # download (a new CPython or Node leaves little in common). It needs
          # this release's own archive to compare against, and in CI that sits in
          # `current/`, not next to `--out` — without the explicit path the guard
          # has nothing to measure and quietly does nothing.
          full_archive="$(ls current/*.tar.gz | head -1)"
          if [ -z "$full_archive" ]; then
            echo "::error::no full pack in current/ to size the delta against"
            exit 1
          fi
          python3 desktop/pack/build_delta.py \
            --base base --target target --out out \
            --full-archive "$full_archive"

      - name: Upload the incremental update
        if: steps.previous.outputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: pack-delta-${{ matrix.platform }}
          path: |
            out/*.delta.tar.gz
            out/*.delta.tar.gz.sha256
            out/*.delta.catalog.json
          if-no-files-found: warn
          retention-days: 14

  # Linux is a v1.x target: the *pack* side is platform-agnostic (same CPython
  # tag, same locked wheels, same Node), so this job exists to prove that and to
  # have a catalog entry ready. The shell still needs deb/rpm/AppImage bundles
  # plus WebKitGTK host dependencies, which is why this is opt-in.
  packs-linux:
    name: Runtime pack (linux-x86_64, preview)
    needs: validate
    if: inputs.include_linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        run: pip install --quiet uv

      - name: Build the web frontend
        working-directory: web
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Build the runtime pack
        run: python3 desktop/pack/build_pack.py --skip-web-build --platform linux-x86_64

      - name: Upload the pack and its catalog fragment
        uses: actions/upload-artifact@v4
        with:
          name: runtime-pack-linux-x86_64
          path: |
            desktop/pack/dist/*.tar.gz
            desktop/pack/dist/*.tar.gz.sha256
            desktop/pack/dist/*.catalog.json
          if-no-files-found: error
          retention-days: 14

  shell:
    name: Shell bundle (${{ matrix.manifest_platform }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - manifest_platform: darwin-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            tauri_args: "--target aarch64-apple-darwin --bundles app,dmg"
          - manifest_platform: darwin-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            tauri_args: "--target x86_64-apple-darwin --bundles app,dmg"
          - manifest_platform: windows-x86_64
            os: windows-2022
            target: ""
            tauri_args: "--bundles nsis,msi"
    env:
      # Job-level so step conditions can test them (`secrets` is not available
      # in `if:`), which is how the signing steps stay optional.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}" 2>/dev/null || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the Tauri CLI
        run: npm install --global @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}

      # `tauri icon` regenerates .icns/.ico from the PNG the repository ships;
      # the bundle targets refuse to build without them.
      - name: Generate the icon set
        run: tauri icon desktop/src-tauri/icons/icon.png --output desktop/src-tauri/icons

      # The Tauri bundler's Windows signing reads a certificate *thumbprint*
      # from the config, not a file: import the PFX here and hand it the
      # thumbprint (see RELEASE_SIGNING.md).
      - name: Import the Windows signing certificate
        if: matrix.os == 'windows-2022' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "deeptutor.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $signing = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          }
          # Written next to tauri.conf.json, because that is the working
          # directory the build step passes the path from.
          $signing | ConvertTo-Json -Depth 5 | Set-Content -Path desktop/src-tauri/windows-signing.json -Encoding utf8
          Write-Host "imported $($certificate.Thumbprint) for the bundler"

      - name: Build the bundle
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          set -euo pipefail
          args=(build ${{ matrix.tauri_args }})
          if [ -n "$WINDOWS_CERTIFICATE" ]; then
            args+=(--config windows-signing.json)
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            # Without the updater private key the bundler cannot produce
            # signatures, and `--no-sign` is how it is told to carry on. Code
            # signing on macOS is independent: it simply does not happen when no
            # certificate is configured.
            args+=(--no-sign)
            echo "::warning title=Update channel disabled::TAURI_SIGNING_PRIVATE_KEY is not set, so this platform produces no updater signature and latest.json will not cover it."
          fi
          if [ -z "${APPLE_CERTIFICATE:-}" ] && [ "${{ runner.os }}" = "macOS" ]; then
            echo "::warning title=Unsigned macOS bundle::APPLE_CERTIFICATE is not set; the .app is ad-hoc signed and will not pass Gatekeeper on another Mac."
          fi
          tauri "${args[@]}"

      # Gatekeeper on Apple silicon refuses to launch an unsigned bundle at all,
      # so an ad-hoc signature at least keeps the artifact inspectable.
      - name: Ad-hoc sign when no certificate is configured
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE == ''
        shell: bash
        run: |
          set -euo pipefail
          app="desktop/target/${{ matrix.target }}/release/bundle/macos/DeepTutor.app"
          codesign --force --deep --sign - "$app"
          echo "ad-hoc signed $app (not distributable)"

      - name: Verify the macOS signature and notarization
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          bundle="desktop/target/${{ matrix.target }}/release/bundle"
          app="$bundle/macos/DeepTutor.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | sed -n '1,12p'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          echo "signed, notarized and stapled: $app"

      # Tauri notarizes and staples the .app (inside the app bundle step) but
      # not the disk image that carries it, so the dmg gets its own round trip.
      - name: Notarize and staple the dmg
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && env.APPLE_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(ls desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          echo "notarized and stapled: $dmg"

      - name: Verify the Windows signature
        if: matrix.os == 'windows-2022' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Recurse -Path desktop/target/release/bundle -Include *.exe,*.msi
          $invalid = @()
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            Write-Host "$($installer.Name): $($signature.Status)"
            if ($signature.Status -ne 'Valid') { $invalid += $installer.Name }
          }
          if ($invalid.Count -gt 0) {
            throw "unsigned or invalid signature on: $($invalid -join ', ')"
          }

      - name: Collect the shell artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/shell
          # Only what a user (or the updater) consumes: installers, the updater
          # archive, and the signatures that go with them.
          find desktop/target -path "*/release/bundle/*" \
            \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.exe" -o -name "*.msi" -o -name "*.sig" \) \
            -exec cp {} dist/shell/ \;
          # `gh release upload` names assets by basename, and the Tauri bundler
          # calls the updater archive `DeepTutor.app.tar.gz` on *both* macOS
          # architectures. Without this prefix the x86_64 job would overwrite the
          # aarch64 asset, leaving `latest.json`'s darwin-aarch64 entry pointing
          # at bytes its signature does not match.
          platform="${{ matrix.manifest_platform }}"
          for artifact in dist/shell/*; do
            [ -e "$artifact" ] || continue
            mv "$artifact" "dist/shell/${platform}-$(basename "$artifact")"
          done
          ls -l dist/shell

      - name: Upload the shell artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shell-${{ matrix.manifest_platform }}
          path: dist/shell/*
          if-no-files-found: error
          retention-days: 14

  updater:
    name: Assemble latest.json
    needs: shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the shell artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: shell-*
          merge-multiple: false

      - name: Write the release notes
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          event_path = os.environ.get("GITHUB_EVENT_PATH")
          event = json.loads(pathlib.Path(event_path).read_text()) if event_path else {}
          body = ((event.get("release") or {}).get("body") or "").strip()
          if not body:
              body = f"DeepTutor {os.environ['VERSION']}"
          pathlib.Path("notes.md").write_text(body + "\n", encoding="utf-8")
          print(body[:200])
          PY
        env:
          # The version comes from the source of truth, not the ref, so a
          # workflow_dispatch run cannot label the manifest with a branch name.
          VERSION: ${{ github.ref_name }}

      - name: Merge the per-platform signatures
        env:
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
        run: |
          set -euo pipefail
          version="$(python3 -c "import re,pathlib;print(re.search(r'__version__\s*=\s*[\"\\']([^\"\\']+)', pathlib.Path('deeptutor/__version__.py').read_text()).group(1))")"
          echo "manifest version: $version"
          published=0
          for directory in dist/shell-*/; do
            platform="$(basename "$directory" | sed 's/^shell-//')"
            artifact="$(find "$directory" -name '*.app.tar.gz' -o -name '*-setup.exe' | head -1 || true)"
            if [ -z "$artifact" ]; then
              echo "::warning::no updater artifact in $directory"
              continue
            fi
            if [ ! -f "$artifact.sig" ]; then
              echo "::warning::no signature for $platform (TAURI_SIGNING_PRIVATE_KEY missing?)"
              continue
            fi
            python3 desktop/scripts/assemble_updater_manifest.py \
              --manifest latest.json \
              --version "$version" \
              --platform "$platform" \
              --artifact "$artifact" \
              --signature "$artifact.sig" \
              --base-url "$BASE_URL" \
              --notes-file notes.md
            published=$((published + 1))
          done
          if [ "$published" -eq 0 ]; then
            echo "::warning title=No update manifest::No platform produced a signed updater artifact, so latest.json is not published and installed apps will not see this release."
          else
            echo "latest.json covers $published platform(s):"
            python3 -c "import json;print(sorted(json.load(open('latest.json'))['platforms']))"
          fi

      - name: Upload the manifest
        uses: actions/upload-artifact@v4
        with:
          name: shell-updater-manifest
          path: latest.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish to the release
    # Only a published GitHub release (or an explicit workflow_dispatch) has an
    # asset target; a plain workflow run just leaves the artifacts for download.
    if: github.event_name == 'release' || inputs.publish
    needs: [catalog, shell, updater]
    runs-on: ubuntu-latest
    steps:
      - name: Download every artifact
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Attach the artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || github.ref_name }}"
          files=$(find dist -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.sig' -o -name 'runtime-packs.json' -o -name 'latest.json' \) | sort)
          echo "$files"
          if [ -z "$files" ]; then
            echo "::error::nothing to publish"
            exit 1
          fi
          # shellcheck disable=SC2086
          gh release upload "$tag" $files --clobber

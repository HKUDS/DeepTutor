name: Docker Build

on:
  workflow_dispatch:
    inputs:
      workflow_name:
        description: '本次构建任务名称 (用于标识，例如：401 修复测试、dev 分支构建)'
        required: false
        default: 'Build & Publish Docker Image'
        type: string
      branch:
        description: '要构建的分支 (例如：main, dev/personal, fix/401-auth)'
        required: true
        default: 'main'
        type: string
      image_tag:
        description: '自定义镜像 tag (例如：latest, dev, v1.0.0，留空则自动生成)'
        required: false
        default: ''
        type: string
      platforms:
        description: '目标平台 (linux/amd64, linux/arm64, 或 both)'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: choice
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64
      target:
        description: 'Dockerfile 目标阶段'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - development
      push_to_registry:
        description: '推送到容器镜像仓库'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Set run name
        run: |
          echo "🚀 ${{ inputs.workflow_name }}"
          echo "::set-output name=run_name::${{ inputs.workflow_name }}"
        id: set_run_name

      - name: Determine branch
        id: branch
        run: |
          echo "branch=${{ inputs.branch }}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.branch }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: inputs.push_to_registry == true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "Custom tag: ${{ inputs.image_tag }}"
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "Auto tag: ${{ inputs.branch }}-${{ github.sha }}"
            echo "tag=${{ inputs.branch }}-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Determine platforms
        id: platforms
        run: |
          echo "platforms=${{ inputs.platforms }}" >> $GITHUB_OUTPUT

      - name: Determine target
        id: target
        run: |
          echo "target=${{ inputs.target }}" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            ${{ steps.tag.outputs.tag }}
            type=sha,format=short,prefix=${{ steps.tag.outputs.tag }}-,enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag == '' }}
          labels: |
            org.opencontainers.image.title=DeepTutor
            org.opencontainers.image.description=DeepTutor AI Tutor Platform
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.branch=${{ steps.branch.outputs.branch }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ steps.target.outputs.target }}
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: ${{ inputs.push_to_registry }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.tag }}

      - name: Output build summary
        run: |
          echo "## 📦 Docker 构建摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**任务名称**: ${{ inputs.workflow_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**构建状态**: ${{ job.status == 'success' && '✅ 成功' || '❌ 失败' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 参数" >> $GITHUB_STEP_SUMMARY
          echo "  - 分支：${{ inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "  - 镜像 Tag: ${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "  - 平台：${{ inputs.platforms }}" >> $GITHUB_STEP_SUMMARY
          echo "  - 目标：${{ inputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "  - 推送：${{ inputs.push_to_registry && '是' || '否' }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ inputs.push_to_registry }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📌 镜像信息" >> $GITHUB_STEP_SUMMARY
            echo "- **镜像地址**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
            echo "- **拉取命令**: \`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 链接" >> $GITHUB_STEP_SUMMARY
          echo "- [查看容器镜像](https://ghcr.io/${{ env.IMAGE_NAME }})" >> $GITHUB_STEP_SUMMARY
          echo "- [查看构建日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

name: Linting and Formatting

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-format:
    name: Linting and Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Install frontend dependencies
        working-directory: ./web
        run: npm ci

      - name: Run pre-commit
        id: pre-commit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
            mapfile -t changed_files < <(git diff --name-only "${BASE_REF}...HEAD")
            if [ ${#changed_files[@]} -eq 0 ]; then
              echo "No changed files in PR; skipping pre-commit."
              exit 0
            fi
            pre-commit run --files "${changed_files[@]}" --show-diff-on-failure
          else
            pre-commit run --all-files --show-diff-on-failure
          fi
        continue-on-error: true

      - name: Provide fix instructions on failure
        if: steps.pre-commit.outcome == 'failure'
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════════════════╗"
          echo "║                     ❌ Pre-commit checks failed!                          ║"
          echo "╠═══════════════════════════════════════════════════════════════════════════╣"
          echo "║  Please run the following commands locally to fix formatting issues:      ║"
          echo "║                                                                           ║"
          echo "║    pip install pre-commit       # Install pre-commit (if not installed)  ║"
          echo "║    pre-commit install           # Set up git hooks (recommended)         ║"
          echo "║    pre-commit run --all-files   # Fix all formatting issues              ║"
          echo "║                                                                           ║"
          echo "║  Then commit and push the changes.                                        ║"
          echo "║                                                                           ║"
          echo "║  💡 Tip: After running 'pre-commit install', hooks will run              ║"
          echo "║     automatically on every commit!                                        ║"
          echo "╚═══════════════════════════════════════════════════════════════════════════╝"
          echo ""
          exit 1

name: Modular installation
on:
  pull_request:
    paths:
      - 'deeptutor/**'
      - 'deeptutor_cli/**'
      - 'pyproject.toml'
      - 'build_support.py'
      - 'setup.py'
      - 'scripts/*module*'
      - 'scripts/check_minimal_install.py'
      - '.github/workflows/modules.yml'
  workflow_dispatch:

# A new push supersedes every earlier run for the same PR/branch. Without this,
# each fix-up commit leaves the previous full matrix running to completion,
# delaying feedback for the author and every other PR in the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wheel-lifecycle:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python scripts/sync_module_requirements.py --check
      - run: python scripts/build_modules.py --output dist/modules --module core --module solve --module parsing --module research --module calendar
      - run: python scripts/check_module_install.py --wheelhouse dist/modules --extended

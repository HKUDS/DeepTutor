name: Tests

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "tests/**"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "web/**"
      - "alembic/**"
      - "alembic.ini"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "tests/**"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "web/**"
      - "alembic/**"
      - "alembic.ini"
      - ".github/workflows/tests.yml"

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.0

      - name: Run Ruff lint
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

  web-tests:
    name: Web Node Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Run frontend node tests
        working-directory: web
        run: npm run test:node

      # eslint was not a gate, so #921 landed two real React violations: a
      # predicate named like a hook (tripping rules-of-hooks) and a synchronous
      # setState inside an effect. Errors only — the repo still carries i18n
      # literal warnings, and turning those red is a separate cleanup.
      - name: Lint frontend
        working-directory: web
        run: npx eslint .

  i18n:
    name: i18n Parity and Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      # Every locale is compared against en, so a locale added later is covered
      # from the moment its directory exists. Without this gate the parity
      # script existed but nothing ran it, and a locale could drift silently.
      - name: Check i18n parity and audit
        working-directory: web
        run: npm run i18n:check

  import-check:
    name: Import Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements/server.txt', 'requirements/cli.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install minimal dependencies for import check
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt

      - name: Check module imports
        run: |
          echo "🐍 Testing with Python ${{ matrix.python-version }}"
          python -c "from deeptutor.runtime.orchestrator import ChatOrchestrator; print('✅ Orchestrator imports OK')"
          python -c "from deeptutor.runtime.registry.tool_registry import get_tool_registry; print('✅ Tool registry imports OK')"
          python -c "from deeptutor.runtime.registry.capability_registry import get_capability_registry; print('✅ Capability registry imports OK')"
          python -c "from deeptutor.services.config.runtime_settings import RuntimeSettingsService; print('✅ RuntimeSettingsService imports OK')"
          python -c "from deeptutor.api.routers.unified_ws import unified_websocket; print('✅ Unified WS imports OK')"
          python -c "from deeptutor.services.prompt.manager import PromptManager; print('✅ Prompt manager imports OK')"
          python -c "from deeptutor.logging import configure_logging, bind_log_context, capture_process_logs, ProcessLogEvent; print('✅ Logging imports OK')"
        env:
          PYTHONPATH: ${{ github.workspace }}

  python-tests:
    name: Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: import-check
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements/server.txt', 'requirements/cli.txt', 'requirements/partners.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install smoke test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt
          pip install -r requirements/partners.txt
          pip install pytest pytest-asyncio

      - name: Create minimal runtime config
        run: |
          mkdir -p data/user/settings
          cat > data/user/settings/main.yaml <<'YAML'
          system:
            language: en
          logging:
            level: WARNING
          YAML
          cp tests/fixtures/ci_model_catalog.json data/user/settings/model_catalog.json

      - name: Run Python tests
        run: |
          echo "🧪 Running Python tests on Python ${{ matrix.python-version }}"
          pytest -q -m "not postgres" tests deeptutor/learning/tests
        env:
          PYTHONPATH: ${{ github.workspace }}

  postgres-tests:
    name: Postgres Integration Tests
    runs-on: ubuntu-latest
    needs: import-check

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: deeptutor
          POSTGRES_DB: deeptutor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:deeptutor@localhost:5432/deeptutor
      DATABASE_URL_TEST: postgresql://postgres:deeptutor@localhost:5432/deeptutor_test
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pg-${{ hashFiles('requirements/server.txt', 'requirements/partners.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-pg-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt
          # Collection walks all of `testpaths`, not just the Postgres-marked
          # tests, so this job needs the same imports the plain matrix installs
          # or `--collect-only` fails on an unrelated module.
          pip install -r requirements/partners.txt
          pip install pytest pytest-asyncio "psycopg[binary,pool]" alembic

      # The service container is created fresh for every run, so this database
      # never pre-exists and a plain CREATE is enough.
      - name: Create test database
        env:
          PGPASSWORD: deeptutor
        run: psql -h localhost -U postgres -c "CREATE DATABASE deeptutor_test"

      - name: Create minimal runtime config
        run: |
          mkdir -p data/user/settings
          cat > data/user/settings/main.yaml <<'YAML'
          system:
            language: en
          logging:
            level: WARNING
          YAML
          cp tests/fixtures/ci_model_catalog.json data/user/settings/model_catalog.json

      # Phase 0A of BUILD_PLAN adds alembic.ini; until it lands there is no
      # schema to apply and no Postgres-marked test to run. Both steps report
      # what they did rather than silently passing, so a green check never
      # implies coverage that does not exist yet.
      # Runs against DATABASE_URL (deeptutor), which is Phase 0A acceptance
      # criterion 1: the migration chain applies cleanly from an empty database.
      # deeptutor_test is left to the storage-test fixtures, which own its
      # create/drop cycle.
      - name: Apply migrations
        run: |
          if [ -f alembic.ini ]; then
            echo "🗄️  alembic upgrade head"
            python -m alembic upgrade head
          else
            echo "⏭️  No alembic.ini yet (BUILD_PLAN Phase 0A) — nothing to migrate."
          fi

      # Distinguish "no such tests yet" (pytest exit 5) from "collection broke"
      # (any other non-zero). Treating both as skip would turn an import error
      # into a green check.
      - name: Run Postgres integration tests
        run: |
          set +e
          pytest -m postgres --collect-only -q >/dev/null 2>&1
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "🧪 Running Postgres-marked tests"
              pytest -q -m postgres
              ;;
            5)
              echo "⏭️  No tests marked @pytest.mark.postgres yet (BUILD_PLAN Phase 0A/0B)."
              ;;
            *)
              echo "❌ Test collection failed (pytest exit $rc):"
              pytest -m postgres --collect-only -q
              exit 1
              ;;
          esac

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, web-tests, i18n, import-check, python-tests, postgres-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint and format | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web node tests | ${{ needs.web-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| i18n parity and audit | ${{ needs.i18n.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Import check (3.11/3.12/3.13; 3.14 best-effort) | ${{ needs.import-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python tests (3.11/3.12/3.13; 3.14 best-effort) | ${{ needs.python-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Postgres integration | ${{ needs.postgres-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if tests failed
        if: needs.lint.result == 'failure' || needs.web-tests.result == 'failure' || needs.i18n.result == 'failure' || needs.import-check.result == 'failure' || needs.python-tests.result == 'failure' || needs.postgres-tests.result == 'failure'
        run: exit 1

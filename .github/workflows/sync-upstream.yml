name: Sync upstream and build Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: AppTeamit1
          password: ${{ secrets.SYNC_TOKEN }}

      - name: Get version
        id: version
        run: |
          VERSION=$(python3 -c "exec(open('deeptutor/__version__.py').read()); print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/apprentus/deeptutor:latest
            ghcr.io/apprentus/deeptutor:${{ steps.version.outputs.version }}

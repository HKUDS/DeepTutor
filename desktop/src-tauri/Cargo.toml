[package]
name = "deeptutor-desktop"
# Kept identical to deeptutor/__version__.py by desktop/scripts/sync_version.py
# (Phase 2). Until that script lands, bump both by hand.
version = "1.6.10"
edition = "2021"
rust-version = "1.77"
description = "DeepTutor desktop shell (Tauri v2)"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deeptutor = { path = "../plugins/tauri-plugin-deeptutor" }
# Native integration. Rust-side use needs no capability entry; a capability is
# only required for calls that come from JavaScript.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
# Phase 3 native integration: OS notifications (round finished) and the
# `deeptutor://` URL scheme + file associations registered from tauri.conf.json.
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
# Shell self-update channel (Phase 2 tail). The UI-facing commands live in
# `tauri-plugin-deeptutor`; this is the plugin registration + config.
tauri-plugin-updater = "2"
# Runtime pack handling: tar.gz extraction, digests, downloads.
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
ureq = "2"
# Verifies the runtime-pack catalog's minisign signature. Deliberately the same
# crate (and the same keypair) the updater plugin uses, so the shell plane and
# the runtime plane have one trust anchor rather than two.
minisign-verify = "0.2"
# Decoding the base64 shapes a minisign public key arrives in.
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
# Process-group signalling for the orphan guard: the launcher owns two children
# (uvicorn + Node) and a plain child.kill() would leave both running.
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepTutor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0a0a0f; overflow: hidden; font-family: system-ui, sans-serif; }
    .loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 24px; }
    .spinner { width: 48px; height: 48px; border: 3px solid rgba(99,102,241,0.2); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .label { color: rgba(255,255,255,0.6); font-size: 14px; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <div class="label">Starting DeepTutor...</div>
  </div>
  <script>
    const url = new URL(window.location.href);
    // The URL is double-encoded by Electron's file:// protocol + our encodeURIComponent.
    // Decode once to get the actual frontend URL.
    const frontendUrl = decodeURIComponent(url.searchParams.get('url') || '');
    if (frontendUrl) {
      document.body.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.src = frontendUrl;
      iframe.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:none;';
      document.body.appendChild(iframe);
    }
  </script>
</body>
</html>
